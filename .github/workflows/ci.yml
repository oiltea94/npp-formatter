name: Windows build and release checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test catalog updates and PR reuse without API writes
        run: python -m unittest discover -s tests -p test_catalog.py
      - name: Test editor text snapshot races
        run: python -m unittest discover -s tests -p test_scintilla_text.py

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-latest
            node: x64
          - arch: x64
            runner: windows-latest
            node: x64
          - arch: arm64
            runner: windows-11-arm
            node: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate version, release notes and tag
        run: |
          $arguments = @('scripts/release.py', 'check')
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $arguments += @('--tag', $env:GITHUB_REF_NAME) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed' }
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: ${{ matrix.node }}
          cache: npm
      - name: Install test dependencies and verified compiler
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          python scripts/bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw 'Compiler bootstrap failed' }
          # Use the hash-verified build toolchain's clang-format for tests only.
          # This x64 tool runs under Windows emulation on the ARM64 runner.
          "CLANG_FORMAT_EXE=$((Resolve-Path '.tools/llvm-mingw-20261104-ucrt-x86_64/bin/clang-format.exe').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tests/download_ruff.py --arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw 'Test Ruff download failed' }
          "RUFF_EXE=$((Resolve-Path 'build/${{ matrix.arch }}/ruff/ruff.exe').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build, test and verify package
        run: ./scripts/build.ps1 -Architecture ${{ matrix.arch }} -RequireRuntimeTests
      - name: Test artifact validation failure cases
        run: python -m unittest discover -s tests -p test_artifacts.py
      - name: Test matching portable Notepad++
        run: |
          python tests/download_npp.py --arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw 'Editor download failed' }
          $env:NPP_EXE = (Resolve-Path 'build/${{ matrix.arch }}/editor/notepad++.exe').Path
          python tests/editor_smoke.py --arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw 'Editor smoke test failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: NppFormatter-${{ matrix.arch }}
          path: |
            dist/*-${{ matrix.arch }}.zip
            dist/*-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-checks-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/editor-smoke-*.json
          if-no-files-found: ignore

  assemble:
    needs: [automation, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: NppFormatter-*
          path: candidates
      - name: Test release validation failure cases
        env:
          RELEASE_CANDIDATES: candidates
        run: |
          python -m pip install jsonschema==4.23.0
          python -m unittest discover -s tests -p test_release.py
      - name: Verify and assemble all release attachments
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/release.py assemble --candidates candidates --output release --notes release-notes.md --repository "$RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --draft --verify-tag \
            --title "NppFormatter $RELEASE_TAG" --notes-file notes/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false

  catalog:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'oiltea94/npp-formatter'
    uses: ./.github/workflows/catalog.yml
    with:
      tag: ${{ github.ref_name }}
      dry_run: ${{ vars.NPP_CATALOG_AUTO_SUBMIT != 'true' }}
    secrets:
      NPP_PLUGIN_LIST_TOKEN: ${{ secrets.NPP_PLUGIN_LIST_TOKEN }}
